<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="description" content="JASAD — bouger chez soi, gratuitement. Sans compte, sans publicité, sans géolocalisation. Tout reste sur ton téléphone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JASAD · جسد — bouger chez soi</title>
<style>
:root{
  --fond:#0B1220; --fond2:#111C2E; --carte:#16233A; --carte2:#1C2C47;
  --trait:#26374F; --texte:#EAF0F8; --doux:#93A4BF;
  --or:#E3B25C; --or2:#F2D08A; --em:#17B8A6; --em2:#0E8C7F;
  --rouge:#E06A5A; --vert:#4BC48A;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 50% -12%,#1B2C48 0%,var(--fond) 55%) no-repeat,var(--fond);
  color:var(--texte);
  font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:96px;
  overflow-x:hidden;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.25;margin:0}
a{color:var(--or2)}
.hidden{display:none !important}

/* ---------- bandeau ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:rgba(11,18,32,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--trait);
}
.topin{max-width:720px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:11px}
.logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:linear-gradient(140deg,var(--or) 0%,#B9843A 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:700;font-size:19px;color:#20160A;
  box-shadow:0 6px 18px rgba(227,178,92,.28)
}
.topin .who{flex:1;min-width:0}
.topin .who b{display:block;font-family:Georgia,serif;font-size:16px;letter-spacing:.2px}
.topin .who span{display:block;font-size:11.5px;color:var(--doux);letter-spacing:.4px;text-transform:uppercase}
.seriechip{
  background:rgba(227,178,92,.14);border:1px solid rgba(227,178,92,.35);color:var(--or2);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap
}

/* ---------- blocs ---------- */
.card{
  background:linear-gradient(170deg,var(--carte) 0%,var(--fond2) 100%);
  border:1px solid var(--trait);border-radius:var(--r);padding:18px;margin:14px 0;
  box-shadow:0 10px 26px rgba(0,0,0,.22)
}
.card.tight{padding:14px}
.sect{margin:26px 0 10px;font-family:Georgia,serif;font-size:21px}
.sous{color:var(--doux);font-size:14px;margin:4px 0 0}
.hr{height:1px;background:var(--trait);border:0;margin:16px 0}

/* ---------- boutons ---------- */
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;
  font-family:inherit;font-size:16.5px;font-weight:700;letter-spacing:.2px;
  color:#1B1206;background:linear-gradient(135deg,var(--or2) 0%,var(--or) 60%,#C8913F 100%);
  box-shadow:0 10px 24px rgba(227,178,92,.26);cursor:pointer;text-align:center
}
.btn:active{transform:translateY(1px)}
.btn.g{background:linear-gradient(135deg,#38D6BE 0%,var(--em) 55%,var(--em2) 100%);
  color:#04201D;box-shadow:0 10px 24px rgba(23,184,166,.24)}
.btn.ghost{background:transparent;border:1px solid var(--trait);color:var(--texte);box-shadow:none;
  font-weight:600;font-size:15px;padding:13px 16px}
.btn.ghost:active{background:var(--carte2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

/* ---------- accueil ---------- */
.hero{padding:22px 0 4px;text-align:center}
.hero .ar{font-family:Georgia,serif;font-size:44px;color:var(--or);letter-spacing:6px;line-height:1}
.hero h1{font-size:31px;margin:8px 0 6px}
.hero p{color:var(--doux);margin:0;font-size:15px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 0}
.stat{background:var(--carte2);border:1px solid var(--trait);border-radius:13px;padding:13px 10px;text-align:center}
.stat b{display:block;font-family:Georgia,serif;font-size:25px;color:var(--or2);line-height:1.15}
.stat span{display:block;font-size:11.5px;color:var(--doux);margin-top:3px;line-height:1.35}

/* ---------- cartes programme ---------- */
.prog{
  display:flex;gap:14px;align-items:flex-start;background:linear-gradient(160deg,var(--carte2) 0%,var(--carte) 100%);
  border:1px solid var(--trait);border-radius:var(--r);padding:16px;margin:12px 0;cursor:pointer
}
.prog:active{background:var(--carte2)}
.prog .badge{
  flex:0 0 52px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:16px;font-weight:700;color:#0B1220
}
.prog .badge.n1{background:linear-gradient(140deg,#7FE3D4,#17B8A6)}
.prog .badge.n2{background:linear-gradient(140deg,#F2D08A,#E3B25C);color:#241806}
.prog .badge.n3{background:linear-gradient(140deg,#F0A48F,#D0664F);color:#2A0E06}
.prog h3{font-size:18px}
.prog p{margin:4px 0 0;color:var(--doux);font-size:13.5px}
.pill{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--trait);
  border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--doux);margin:7px 6px 0 0}

/* ---------- listes ---------- */
.item{
  display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;
  background:var(--carte);border:1px solid var(--trait);margin:9px 0
}
.item .num{
  flex:0 0 34px;width:34px;height:34px;border-radius:11px;background:rgba(227,178,92,.13);
  color:var(--or2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px
}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15.5px}
.item .tx span{display:block;color:var(--doux);font-size:12.5px;margin-top:2px}
.chev{color:var(--doux);font-size:20px}

/* ---------- lecteur ---------- */
#player{position:fixed;inset:0;z-index:80;background:radial-gradient(900px 520px at 50% 8%,#1D3050 0%,#0A1120 60%) no-repeat,#0A1120;
  display:flex;flex-direction:column;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.pl-top{display:flex;align-items:center;gap:12px}
.pl-top .quit{background:rgba(255,255,255,.07);border:1px solid var(--trait);color:var(--texte);
  border-radius:11px;padding:9px 13px;font-size:14px;font-weight:600;font-family:inherit}
.pl-prog{flex:1;height:6px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.pl-prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--em),var(--or));border-radius:99px;
  transition:width .3s ease}
.pl-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0}
.ring{position:relative;width:min(70vw,268px);height:min(70vw,268px)}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .inside .big{font-family:Georgia,serif;font-size:58px;font-weight:700;line-height:1}
.ring .inside .lab{color:var(--doux);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin-top:6px}
.pl-nom{font-family:Georgia,serif;font-size:27px;margin:22px 0 6px;line-height:1.2}
.pl-geste{color:#C9D6E8;font-size:15px;max-width:440px;margin:0 auto}
.pl-rep{display:inline-block;margin-top:14px;background:rgba(23,184,166,.13);border:1px solid rgba(23,184,166,.4);
  color:#7FE3D4;border-radius:999px;padding:7px 16px;font-weight:700;font-size:15px}
.pl-info{margin-top:12px;color:var(--doux);font-size:13px}
.pl-bot{padding-top:10px}
.pl-bot .ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.pl-bot .ctrl button{border:0;border-radius:14px;padding:16px 8px;font-family:inherit;font-size:15px;font-weight:700;
  background:var(--carte2);color:var(--texte);border:1px solid var(--trait)}
.pl-bot .ctrl button.main{background:linear-gradient(135deg,#38D6BE,var(--em2));color:#04201D;border:0}
.pl-bot .ctrl button.done{background:linear-gradient(135deg,var(--or2),#C8913F);color:#241806;border:0}
.nextup{text-align:center;color:var(--doux);font-size:13.5px;margin-top:12px}

/* ---------- fin ---------- */
.fin{text-align:center}
.fin .gros{font-family:Georgia,serif;font-size:56px;color:var(--or2);line-height:1}
.dhikr{background:linear-gradient(160deg,#1A2A42,#142033);border:1px solid rgba(227,178,92,.28);border-radius:var(--r);
  padding:18px;margin:18px 0;text-align:center}
.dhikr .ar{font-family:Georgia,serif;font-size:26px;color:var(--or);letter-spacing:3px;line-height:1.9}
.dhikr .fr{color:#C9D6E8;font-size:14.5px;margin-top:8px}
.dhikr .src{color:var(--doux);font-size:12px;margin-top:8px;letter-spacing:.3px}

/* ---------- divers ---------- */
.note{background:rgba(23,184,166,.07);border-left:3px solid var(--em);border-radius:10px;padding:12px 14px;
  font-size:14px;color:#C9D6E8;margin:12px 0}
.note.or{background:rgba(227,178,92,.08);border-left-color:var(--or)}
.note.rouge{background:rgba(224,106,90,.09);border-left-color:var(--rouge)}
.chk{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--trait);border-radius:13px;
  margin:9px 0;background:var(--carte);cursor:pointer}
.chk .bx{flex:0 0 24px;width:24px;height:24px;border-radius:8px;border:2px solid #3C5474;display:flex;
  align-items:center;justify-content:center;font-size:15px;color:#04201D}
.chk.on{border-color:rgba(23,184,166,.55);background:rgba(23,184,166,.08)}
.chk.on .bx{background:var(--em);border-color:var(--em)}
.chk .lb{flex:1}
.chk .lb b{display:block;font-size:15px}
.chk .lb span{display:block;color:var(--doux);font-size:12.5px}
input[type=text]{width:100%;background:var(--fond2);border:1px solid var(--trait);border-radius:13px;
  padding:15px;color:var(--texte);font-family:inherit;font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--or)}
.lab{display:block;font-size:13px;color:var(--doux);margin:14px 0 7px;letter-spacing:.3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .j{aspect-ratio:1;border-radius:9px;background:var(--fond2);border:1px solid var(--trait);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--doux)}
.cal .j.fait{background:linear-gradient(140deg,var(--em),var(--em2));color:#04201D;font-weight:700;border-color:transparent}
.cal .j.aufait{background:rgba(227,178,92,.1);border-color:rgba(227,178,92,.28)}
.bib{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--trait);
  border-radius:14px;margin:9px 0;background:var(--carte)}
.bib .g{flex:0 0 6px;width:6px;border-radius:99px;align-self:stretch}
.bib b{display:block;font-size:15px}
.bib span{display:block;color:var(--doux);font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--trait);background:var(--carte);color:var(--doux);
  border-radius:999px;padding:8px 14px;font-size:13px;font-family:inherit;font-weight:600}
.chip.on{background:rgba(227,178,92,.15);border-color:rgba(227,178,92,.45);color:var(--or2)}
.prom{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--trait)}
.prom:last-child{border-bottom:0}
.prom .k{flex:0 0 26px;width:26px;height:26px;border-radius:9px;background:rgba(75,196,138,.14);color:var(--vert);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.prom .v b{display:block;font-size:14.5px}
.prom .v span{display:block;color:var(--doux);font-size:12.5px}

/* ---------- barre d'onglets ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(12,20,35,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--trait);padding:8px 6px calc(8px + env(safe-area-inset-bottom))
}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:none;border:0;font-family:inherit;color:var(--doux);padding:7px 2px;border-radius:12px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--or2);background:rgba(227,178,92,.09)}
footer.foot{text-align:center;color:var(--doux);font-size:12px;padding:22px 16px 8px;line-height:1.8}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="logo">ج</div>
    <div class="who"><b>JASAD</b><span id="topSous">le corps · جسد</span></div>
    <div class="seriechip" id="topSerie">0 jour</div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="card"><p>Chargement…</p></div>
</main>

<nav class="tabs">
  <div class="in">
    <button id="t-acc" class="on" onclick="goTab(&#39;acc&#39;)"><span class="ic">🏠</span>Accueil</button>
    <button id="t-pro" onclick="goTab(&#39;pro&#39;)"><span class="ic">📋</span>Programmes</button>
    <button id="t-sea" onclick="goTab(&#39;sea&#39;)"><span class="ic">▶</span>Séance</button>
    <button id="t-bib" onclick="goTab(&#39;bib&#39;)"><span class="ic">📚</span>Exercices</button>
    <button id="t-moi" onclick="goTab(&#39;moi&#39;)"><span class="ic">👤</span>Moi</button>
  </div>
</nav>

<div id="player" class="hidden"></div>

<script src="jasad.js"></script>
</body>
</html>
